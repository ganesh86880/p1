
<html>
<body>
<h2>Event Registration</h2>

<form onsubmit="return check()">
<input id="name" placeholder="Name"><br><br>
<input id="email" placeholder="Email"><br><br>
<input id="phone" placeholder="Phone"><br><br>
<input id="gender" placeholder="Gender"><br><br>
<input id="college" placeholder="College"><br><br>
<input id="dept" placeholder="Department"><br><br>
<input id="year" placeholder="Year"><br><br>
<input id="event" placeholder="Event"><br><br>
<button>Register</button>
<button type="reset">Reset</button>
</form>

<script>
function check() {
if(name.value=="" || email.value=="" ||
phone.value=="" || gender.value=="" ||
college.value=="" || dept.value=="" ||
year.value=="" || event.value=="") {
alert("Fill all fields");
return false;
}
alert("Registration successful");
return true;
}
</script>
</body>
</html>
